<style>
.glove-page{padding:45px 0 70px}.glove-breadcrumb{display:flex;gap:8px;align-items:center;margin-bottom:30px;color:var(--muted);font-size:11px}.glove-breadcrumb a{color:var(--muted);text-decoration:none}.glove-breadcrumb a:hover{color:var(--red-light)}.glove-detail{display:grid;grid-template-columns:minmax(280px,.75fr) minmax(0,1.4fr);gap:25px}.glove-showcase{position:relative;min-height:430px;display:flex;align-items:center;justify-content:center;overflow:hidden;background:radial-gradient(circle at center,rgba(226,29,47,.12),transparent 60%),var(--panel);border:1px solid var(--border);border-radius:var(--radius);box-shadow:0 22px 60px rgba(0,0,0,.24)}.glove-showcase img{width:88%;height:88%;object-fit:contain;filter:drop-shadow(0 15px 25px rgba(0,0,0,.35))}.glove-showcase-placeholder{font-size:80px;opacity:.25}.detail-status{position:absolute;top:15px;left:15px;padding:6px 8px;border:1px solid var(--border-red);border-radius:4px;background:rgba(0,0,0,.6);color:var(--red-light);font-size:9px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;z-index:2}.glove-detail-info{padding:10px 0}.detail-kicker{color:var(--red-light);font-size:10px;font-weight:900;letter-spacing:.15em}.glove-detail-info h1{margin:8px 0 5px;font-size:clamp(35px,5vw,58px);line-height:1;letter-spacing:-.05em}.detail-subtitle{margin-bottom:20px;color:var(--muted);font-size:14px}.detail-description{max-width:700px;margin-bottom:25px;color:var(--text-soft);font-size:14px;line-height:1.75}.detail-meta{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:25px}.detail-meta-item{padding:15px;background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);transition:.18s}.detail-meta-item:hover{transform:translateY(-2px);border-color:var(--border-red)}.detail-meta-item span{display:block;margin-bottom:6px;color:var(--muted);font-size:9px;font-weight:900;letter-spacing:.1em;text-transform:uppercase}.detail-meta-item strong{color:var(--white);font-size:12px}.detail-note{padding:16px;background:rgba(226,29,47,.06);border:1px solid var(--border-red);border-radius:var(--radius);color:var(--text-soft);font-size:12px;line-height:1.6}.detail-note strong{color:var(--red-light)}.back-gloves{display:inline-flex;margin-top:25px;padding:10px 14px;background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);color:var(--text-soft);text-decoration:none;font-size:11px;font-weight:800}.back-gloves:hover{border-color:var(--border-red);color:var(--white)}@media(max-width:800px){.glove-detail{grid-template-columns:1fr}.glove-showcase{min-height:320px}}@media(max-width:450px){.detail-meta{grid-template-columns:1fr}}
</style>

<script src="gloves.js"></script><script src="script.js"></script><script>
"use strict";
const escapeHTML=value=>String(value??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/\"/g,"&quot;").replace(/'/g,"&#039;");
const params=new URLSearchParams(window.location.search),gloveId=params.get("glove"),glove=(window.UBG_GLOVES||[]).find(item=>item.id===gloveId),detail=document.getElementById("gloveDetail"),breadcrumb=document.getElementById("breadcrumbName");
if(!glove){document.title="Glove Not Found — Untitled Boxing Game Wiki";breadcrumb.textContent="Not Found";detail.innerHTML='<div style="grid-column:1/-1;padding:70px 20px;text-align:center;background:var(--panel);border:1px solid var(--border);border-radius:var(--radius)"><div style="font-size:50px;opacity:.4">🥊</div><h1>Glove Not Found</h1><p style="color:var(--muted)">The glove is not in the current database.</p><a href="gloves.html" class="back-gloves">← Return to Gloves</a></div>';}else{document.title=`${glove.name} — Untitled Boxing Game Wiki`;breadcrumb.textContent=glove.name;const showcase=glove.showcase||glove.image;const image=showcase?`<img src="${escapeHTML(showcase)}" alt="${escapeHTML(glove.name)}" loading="eager">`:'<div class="glove-showcase-placeholder">🥊</div>';const status=glove.wip?'WIP / UNOBTAINABLE':glove.obtainable?'CURRENTLY AVAILABLE':'UNOBTAINABLE';const tradable=glove.tradable===false?'Not tradable':'Tradable';detail.innerHTML=`<div class="glove-showcase"><div class="detail-status">${status}</div>${image}</div><div class="glove-detail-info"><div class="detail-kicker">${escapeHTML(glove.category)}</div><h1>${escapeHTML(glove.name)}</h1>${glove.subtitle?`<div class="detail-subtitle">${escapeHTML(glove.subtitle)}</div>`:''}<p class="detail-description">${escapeHTML(glove.description)}</p><div class="detail-meta"><div class="detail-meta-item"><span>Rarity</span><strong>${escapeHTML(glove.rarity)}</strong></div><div class="detail-meta-item"><span>Availability</span><strong>${glove.obtainable?'Available':'Unobtainable'}</strong></div><div class="detail-meta-item"><span>Obtaining</span><strong>${escapeHTML(glove.obtain)}</strong></div><div class="detail-meta-item"><span>Trading</span><strong>${tradable}</strong></div>${glove.rank?`<div class="detail-meta-item"><span>Ranked Requirement</span><strong>${escapeHTML(glove.rank)}</strong></div>`:''}${glove.series?`<div class="detail-meta-item"><span>Series</span><strong>${escapeHTML(glove.series)}</strong></div>`:''}</div>${glove.mobileNote?`<div class="detail-note"><strong>MOBILE NOTE</strong><br>${escapeHTML(glove.mobileNote)}</div>`:''}${glove.unusual?`<div class="detail-note" style="margin-top:10px"><strong>UNUSUAL EFFECT</strong><br>This glove has the <strong>${escapeHTML(glove.unusual)}</strong> unusual effect.</div>`:''}<a href="gloves.html" class="back-gloves">← Back to Gloves</a></div>`;}
</script>
