name: Standardize UBG site shell

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  standardize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Standardize shared UBG shell
        shell: python
        run: |
          from pathlib import Path
          import re

          changed = []

          skip = {
              'admin.html',
              'collection.html',
              'gloves.html',
          }

          page_styles = {
              'guides.html': 'guides-polish.css',
              'style.html': 'style-page-polish.css',
          }

          nav = '''<div class="sidebar-section"><div class="sidebar-heading">NAVIGATION</div>
                  <a href="index.html" data-nav="home" class="sidebar-link"><span>⌂</span>Home</a>
                  <a href="styles.html" data-nav="styles" class="sidebar-link"><span>◈</span>Styles</a>
                  <a href="mechanics.html" data-nav="mechanics" class="sidebar-link"><span>⚙</span>Mechanics</a>
                  <a href="ranked.html" data-nav="ranked" class="sidebar-link"><span>♛</span>Ranked</a>
                  <a href="guides.html" data-nav="guides" class="sidebar-link"><span>▤</span>Guides</a>
                  <a href="gloves.html" data-nav="collection" class="sidebar-link"><span>◇</span>Collection</a>
              </div>'''

          contextual_sections = {
              'styles': '''<div class="sidebar-section"><div class="sidebar-heading">STYLES</div>
                  <a href="styles.html?rarity=Uncommon" class="sidebar-sub">Uncommon</a>
                  <a href="styles.html?rarity=Rare" class="sidebar-sub">Rare</a>
                  <a href="styles.html?rarity=Mythic" class="sidebar-sub">Mythic</a>
                  <a href="styles.html?rarity=Legendary" class="sidebar-sub">Legendary</a>
                  <a href="styles.html?rarity=Shiny" class="sidebar-sub">Shiny</a>
              </div>''',
              'style': '''<div class="sidebar-section"><div class="sidebar-heading">STYLES</div>
                  <a href="styles.html?rarity=Uncommon" class="sidebar-sub">Uncommon</a>
                  <a href="styles.html?rarity=Rare" class="sidebar-sub">Rare</a>
                  <a href="styles.html?rarity=Mythic" class="sidebar-sub">Mythic</a>
                  <a href="styles.html?rarity=Legendary" class="sidebar-sub">Legendary</a>
                  <a href="styles.html?rarity=Shiny" class="sidebar-sub">Shiny</a>
              </div>''',
              'mechanics': '''<div class="sidebar-section"><div class="sidebar-heading">MECHANICS</div>
                  <a href="mechanics.html#combat-basics" class="sidebar-sub">Combat Basics</a>
                  <a href="mechanics.html#advanced-combat" class="sidebar-sub">Advanced Combat</a>
                  <a href="mechanics.html#special-systems" class="sidebar-sub">Special Systems</a>
              </div>''',
              'ranked': '''<div class="sidebar-section"><div class="sidebar-heading">RANKED</div>
                  <a href="ranked.html#overview" class="sidebar-sub">Overview</a>
                  <a href="ranked.html#how-ranked-works" class="sidebar-sub">How Ranked Works</a>
                  <a href="ranked.html#placement-matches" class="sidebar-sub">Placement Matches</a>
                  <a href="ranked.html#ranks" class="sidebar-sub">Ranks</a>
              </div>''',
              'guides': '''<div class="sidebar-section"><div class="sidebar-heading">GUIDES</div>
                  <a href="guide-beginner.html" class="sidebar-sub">Getting Started</a>
                  <a href="guide-combat.html" class="sidebar-sub">Combat Fundamentals</a>
                  <a href="guide-movement.html" class="sidebar-sub">Movement Guide</a>
                  <a href="guide-countering.html" class="sidebar-sub">Countering</a>
                  <a href="guide-ranked.html" class="sidebar-sub">Ranked Guide</a>
                  <a href="guide-advanced.html" class="sidebar-sub">Advanced Techniques</a>
              </div>''',
              'collection': '''<div class="sidebar-section"><div class="sidebar-heading">COLLECTION</div>
                  <a href="emotes.html" class="sidebar-sub">Emotes</a>
                  <a href="gloves.html#gloves-overview" class="sidebar-sub">Gloves</a>
                  <a href="gloves.html#unusual-effects" class="sidebar-sub">Unusual Effects</a>
                  <a href="knockdowns.html" class="sidebar-sub">Knockdowns</a>
              </div>''',
          }

          canonical_topbar = '''<header class="topbar">
              <button class="mobile-menu" id="mobileMenu" aria-label="Open navigation">☰</button>
              <a href="index.html" class="wiki-brand" aria-label="Untitled Boxing Game Wiki home">
                  <span class="brand-mark"><img class="brand-icon" src="https://i.ytimg.com/vi/clviPNGycOk/maxresdefault.jpg" alt="Untitled Boxing Game"></span>
                  <span class="brand-text"><strong>UNTITLED BOXING</strong><small>FAN WIKI</small></span>
              </a>
              <div class="global-search">
                  <span class="search-icon">⌕</span>
                  <input type="text" id="globalSearch" placeholder="Search the UBG Wiki..." autocomplete="off">
                  <kbd>CTRL K</kbd>
                  <div id="searchResults" class="search-results"></div>
              </div>
              <a class="play-button" href="https://www.roblox.com/games/13621938427/untitled-boxing-game" target="_blank" rel="noopener noreferrer">PLAY UBG <span>↗</span></a>
          </header>'''

          def active_target(name):
              if name == 'index.html': return 'home'
              if name == 'styles.html': return 'styles'
              if name == 'style.html': return 'style'
              if name.startswith('style-'): return 'styles'
              if name in {'mechanics.html', 'mechanic.html'} or name.startswith('mechanic-'): return 'mechanics'
              if name == 'ranked.html': return 'ranked'
              if name == 'guides.html' or name.startswith('guide-'): return 'guides'
              if name in {'glove.html'} or name.startswith('glove-'): return 'collection'
              if name in {'emotes.html', 'knockdowns.html'}: return 'collection'
              return None

          for path in sorted(Path('.').glob('*.html')):
              if path.name in skip: continue
              text = path.read_text(encoding='utf-8')
              original = text
              marker = '</head>'
              if marker not in text: continue

              text = re.sub(r'<bod(?=\s|>)', '<body', text, count=1, flags=re.I)

              if 'site-standard.css' not in text:
                  text = text.replace(marker, '    <link rel="stylesheet" href="site-standard.css">\n' + marker, 1)

              extra = page_styles.get(path.name)
              if path.name.startswith('guide-'): extra = 'guide-page-polish.css'
              if extra and extra not in text:
                  text = text.replace(marker, f'    <link rel="stylesheet" href="{extra}">\n' + marker, 1)

              target = active_target(path.name)
              if target:
                  def normalize_body(match):
                      attrs = re.sub(r'\sdata-page=["\'][^"\']*["\']', '', match.group(1), flags=re.I)
                      return '<body' + attrs + f' data-page="{target}">'
                  text = re.sub(r'<body\b([^>]*)>', normalize_body, text, count=1, flags=re.I)

              sidebar_parts = [nav]
              if target in contextual_sections: sidebar_parts.append(contextual_sections[target])
              sidebar_parts.append('''<div class="sidebar-bottom"><div class="sidebar-note"><span class="red-dot"></span>Fan-made project</div><div class="sidebar-version">UBG Wiki Redesign</div></div>''')
              sidebar = '<aside class="sidebar" id="sidebar">\n              ' + '\n              '.join(sidebar_parts) + '\n          </aside>'

              nav_target = 'styles' if target == 'style' else target
              if nav_target:
                  sidebar = sidebar.replace(f'data-nav="{nav_target}" class="sidebar-link"', f'data-nav="{nav_target}" class="sidebar-link active"', 1)

              text, _ = re.subn(r'<aside\b[^>]*class=["\']sidebar["\'][^>]*>.*?</aside>', sidebar, text, count=1, flags=re.S | re.I)
              text, _ = re.subn(r'<header\b[^>]*class=["\']topbar["\'][^>]*>.*?</header>', canonical_topbar, text, count=1, flags=re.S | re.I)

              if 'class="wiki-brand"' in text and 'brand-fix.css' not in text:
                  text = text.replace(marker, '    <link rel="stylesheet" href="brand-fix.css">\n' + marker, 1)
              if 'class="wiki-brand"' in text and 'ubg-brand.js' not in text:
                  text = text.replace('</body>', '    <script src="ubg-brand.js"></script>\n</body>', 1)

              if text != original:
                  path.write_text(text, encoding='utf-8')
                  changed.append(path.name)

          print('Standardized:', ', '.join(changed) if changed else 'No changes needed')

      - name: Commit standardized pages
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html'
          if git diff --cached --quiet; then
            echo "No page changes to commit."
            exit 0
          fi
          git commit -m "Unify UBG topbar and navigation shell"
          git push
