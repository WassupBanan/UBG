name: Standardize UBG site shell

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  standardize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add shared stylesheet to site pages
        shell: python
        run: |
          from pathlib import Path

          changed = []
          link = '<link rel="stylesheet" href="site-standard.css">'

          skip = {
              'admin.html',
              'collection.html',
          }

          for path in sorted(Path('.').glob('*.html')):
              if path.name in skip:
                  continue

              text = path.read_text(encoding='utf-8')
              if 'site-standard.css' in text:
                  continue

              marker = '</head>'
              if marker not in text:
                  continue

              text = text.replace(marker, f'    {link}\n{marker}', 1)
              path.write_text(text, encoding='utf-8')
              changed.append(path.name)

          print('Standardized:', ', '.join(changed) if changed else 'No changes needed')

      - name: Commit standardized pages
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html'
          if git diff --cached --quiet; then
            echo "No page changes to commit."
            exit 0
          fi
          git commit -m "Standardize shared UBG page styling"
          git push
