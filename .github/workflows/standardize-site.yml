name: Standardize UBG site shell

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  standardize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Standardize shared UBG shell
        shell: python
        run: |
          from pathlib import Path
          import re

          changed = []

          skip = {
              'admin.html',
              'collection.html',
          }

          page_styles = {
              'guides.html': 'guides-polish.css',
              'style.html': 'style-page-polish.css',
          }

          canonical_sidebar = '''<aside class="sidebar" id="sidebar">
              <div class="sidebar-section"><div class="sidebar-heading">NAVIGATION</div>
                  <a href="index.html" data-nav="home" class="sidebar-link"><span>⌂</span>Home</a>
                  <a href="styles.html" data-nav="styles" class="sidebar-link"><span>◈</span>Styles</a>
                  <a href="mechanics.html" data-nav="mechanics" class="sidebar-link"><span>⚙</span>Mechanics</a>
                  <a href="ranked.html" data-nav="ranked" class="sidebar-link"><span>♛</span>Ranked</a>
                  <a href="guides.html" data-nav="guides" class="sidebar-link"><span>▤</span>Guides</a>
                  <a href="collection.html" data-nav="collection" class="sidebar-link"><span>◇</span>Collection</a>
              </div>
              <div class="sidebar-section"><div class="sidebar-heading">STYLES</div>
                  <a href="styles.html?rarity=Uncommon" class="sidebar-sub">Uncommon</a>
                  <a href="styles.html?rarity=Rare" class="sidebar-sub">Rare</a>
                  <a href="styles.html?rarity=Mythic" class="sidebar-sub">Mythic</a>
                  <a href="styles.html?rarity=Legendary" class="sidebar-sub">Legendary</a>
                  <a href="styles.html?rarity=Shiny" class="sidebar-sub">Shiny</a>
              </div>
              <div class="sidebar-section"><div class="sidebar-heading">COMMUNITY</div>
                  <a href="#" class="sidebar-link"><span>◉</span>Community</a>
                  <a href="#" class="sidebar-link"><span>?</span>Help</a>
              </div>
              <div class="sidebar-bottom"><div class="sidebar-note"><span class="red-dot"></span>Fan-made project</div><div class="sidebar-version">UBG Wiki Redesign</div></div>
          </aside>'''

          def active_target(name):
              if name in {'index.html'}:
                  return 'home'
              if name in {'styles.html', 'style.html'} or name.startswith('style-'):
                  return 'styles'
              if name in {'mechanics.html', 'mechanic.html'} or name.startswith('mechanic-'):
                  return 'mechanics'
              if name == 'ranked.html':
                  return 'ranked'
              if name == 'guides.html' or name.startswith('guide-'):
                  return 'guides'
              if name in {'gloves.html', 'glove.html'} or name.startswith('glove-'):
                  return 'collection'
              return None

          for path in sorted(Path('.').glob('*.html')):
              if path.name in skip:
                  continue

              text = path.read_text(encoding='utf-8')
              original = text
              marker = '</head>'

              if marker not in text:
                  continue

              if 'site-standard.css' not in text:
                  text = text.replace(
                      marker,
                      '    <link rel="stylesheet" href="site-standard.css">\n' + marker,
                      1,
                  )

              extra = page_styles.get(path.name)
              if path.name.startswith('guide-'):
                  extra = 'guide-page-polish.css'

              if extra and extra not in text:
                  text = text.replace(
                      marker,
                      f'    <link rel="stylesheet" href="{extra}">\n' + marker,
                      1,
                  )

              # Every section now uses the exact same sidebar structure as the homepage.
              target = active_target(path.name)
              sidebar = canonical_sidebar
              if target:
                  sidebar = sidebar.replace(
                      f'data-nav="{target}" class="sidebar-link"',
                      f'data-nav="{target}" class="sidebar-link active"',
                      1,
                  )

              text, count = re.subn(
                  r'<aside\b[^>]*class=["\']sidebar["\'][^>]*>.*?</aside>',
                  sidebar,
                  text,
                  count=1,
                  flags=re.S | re.I,
              )

              # Pages with the modern topbar get the same UBG icon treatment as the homepage.
              if 'class="wiki-brand"' in text and 'brand-fix.css' not in text:
                  text = text.replace(
                      marker,
                      '    <link rel="stylesheet" href="brand-fix.css">\n' + marker,
                      1,
                  )

              if 'class="wiki-brand"' in text and 'ubg-brand.js' not in text:
                  text = text.replace(
                      '</body>',
                      '    <script src="ubg-brand.js"></script>\n</body>',
                      1,
                  )

              if text != original:
                  path.write_text(text, encoding='utf-8')
                  changed.append(path.name)

          print('Standardized:', ', '.join(changed) if changed else 'No changes needed')

      - name: Commit standardized pages
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html'
          if git diff --cached --quiet; then
            echo "No page changes to commit."
            exit 0
          fi
          git commit -m "Standardize UBG navigation and branding"
          git push
