name: Standardize UBG site shell

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  standardize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add shared and page-specific stylesheets
        shell: python
        run: |
          from pathlib import Path

          changed = []

          skip = {
              'admin.html',
              'collection.html',
          }

          page_styles = {
              'guides.html': 'guides-polish.css',
              'style.html': 'style-page-polish.css',
          }

          for path in sorted(Path('.').glob('*.html')):
              if path.name in skip:
                  continue

              text = path.read_text(encoding='utf-8')
              original = text
              marker = '</head>'

              if marker not in text:
                  continue

              if 'site-standard.css' not in text:
                  text = text.replace(
                      marker,
                      '    <link rel="stylesheet" href="site-standard.css">\n' + marker,
                      1,
                  )

              extra = page_styles.get(path.name)
              if extra and extra not in text:
                  text = text.replace(
                      marker,
                      f'    <link rel="stylesheet" href="{extra}">\n' + marker,
                      1,
                  )

              if text != original:
                  path.write_text(text, encoding='utf-8')
                  changed.append(path.name)

          print('Standardized:', ', '.join(changed) if changed else 'No changes needed')

      - name: Commit standardized pages
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html'
          if git diff --cached --quiet; then
            echo "No page changes to commit."
            exit 0
          fi
          git commit -m "Add page-specific UBG layout styles"
          git push
